<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, 'PingFang TC', sans-serif; width: 320px; padding: 16px; background: #f8fafc; color: #1e293b; margin: 0; }
        h1 { font-size: 15px; margin: 0 0 12px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
        #analyze-btn { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; }
        #analyze-btn:disabled { opacity: 0.5; cursor: wait; }
        #status { font-size: 12px; margin-top: 10px; color: #64748b; white-space: pre-wrap; line-height: 1.5; }
        #status.error { color: #ef4444; }
        #key-section { margin-bottom: 12px; }
        #key-section input { width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 11px; box-sizing: border-box; margin-bottom: 6px; }
        #key-section button { background: #0f172a; color: #fff; padding: 8px; font-size: 12px; }
        label { font-size: 11px; font-weight: 700; color: #94a3b8; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>🚀 Career Hub 一鍵匯入</h1>
    <div id="key-section" class="hidden">
        <label>Gemini API Key（僅儲存在本機）</label>
        <input id="gemini-key" type="password" placeholder="貼上你的 Gemini API Key">
        <button id="save-key">儲存 Key</button>
    </div>
    <div style="margin-bottom: 10px;">
        <label>職缺網址（留空 = 分析目前開啟的分頁）</label>
        <input id="job-url" placeholder="https://www.linkedin.com/jobs/view/..." style="width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 11px; box-sizing: border-box; margin-top: 4px;">
    </div>
    <button id="analyze-btn">✨ 分析職缺並匯入</button>
    <div id="status"></div>
    <script src="popup.js"></script>
</body>
</html>
